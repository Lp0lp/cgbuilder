# Conda environment for cgbuilder
# Installs Node.js (for running the dev tooling and the web app) and git.
# After creating the environment, activate it and install npm dependencies:
#   conda activate cgbuilder
#   npm install

name: cgbuilder
channels:
    - conda-forge
    - defaults
dependencies:
    - nodejs=20.19.*
    - git

